services:
  # Spark and Python Images
  spark-master:
    image: apache/spark:4.3.0-python3
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./src:/opt/spark/work-dir/src
      # Add events
      - ./events:/opt/spark/events
  
  # First Worker Node
  spark-worker-1:
    image: apache/spark:4.3.0-python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master
  
  # Second Worker Node
  spark-worker-2:
    image: apache/spark:4.3.0-python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master

  # 
  spark-history:
    image: apache/spark:4.3.0-python3
    container_name: spark-history
    hostname: spark-history
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:///opt/spark/events"
      SPARK_DAEMON_MEMORY: "512m"
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./events:/opt/spark/events:ro # ro -> read only


