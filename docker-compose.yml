services:
  # Spark and Python Images
  spark-master:
    image: apache/spark:4.3.0-python3
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./src:/opt/spark/work-dir/src
  
  # First Worker Node
  spark-worker-1:
    image: apache/spark:4.3.0-python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master
  
  # Second Worker Node
  spark-worker-2:
    image: apache/spark:4.3.0-python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master

