services:
  spark-master:
    image: apache/spark:4.3.0-python3
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"